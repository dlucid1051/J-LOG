<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle glow/border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Fuel Pump Body -->
  <g transform="translate(64, 76)">
    <!-- Base Plate -->
    <rect x="30" y="310" width="220" height="24" rx="8" fill="#475569" />
    
    <!-- Main Pump Chassis -->
    <rect x="44" y="60" width="192" height="254" rx="20" fill="url(#accentGrad)" />
    
    <!-- Glass Display Screen -->
    <rect x="68" y="88" width="144" height="96" rx="12" fill="#090d16" />
    <!-- Screen readout lines -->
    <rect x="84" y="108" width="112" height="18" rx="4" fill="#34d399" />
    <rect x="84" y="136" width="76" height="12" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="84" y="154" width="92" height="12" rx="3" fill="#94a3b8" opacity="0.6" />

    <!-- Nozzle cradle & hose hook -->
    <rect x="64" y="210" width="152" height="74" rx="10" fill="#1e3a8a" opacity="0.5" />
    <!-- Fuel symbol drop -->
    <path d="M 140 226 C 140 226 122 250 122 262 C 122 272 130 280 140 280 C 150 280 158 272 158 262 C 158 250 140 226 140 226 Z" fill="#fbbf24" />

    <!-- Fuel Hose -->
    <path d="M 236 120 C 270 120 290 160 290 220 C 290 280 270 300 270 320" fill="none" stroke="#64748b" stroke-width="16" stroke-linecap="round" />
    <!-- Nozzle Handle -->
    <path d="M 270 316 L 270 270 L 296 244 L 312 244 L 290 276 L 290 316 Z" fill="#94a3b8" />
    <path d="M 296 244 L 324 216 L 314 206 L 286 234" fill="#cbd5e1" />
    
    <!-- Receipt slip sticking out of top -->
    <path d="M 104 36 L 176 36 L 176 60 L 104 60 Z" fill="#f8fafc" />
    <path d="M 104 36 L 112 28 L 120 36 L 128 28 L 136 36 L 144 28 L 152 36 L 160 28 L 168 36 L 176 28 L 176 60 L 104 60 Z" fill="#f8fafc" />
    <line x1="116" y1="46" x2="164" y2="46" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
